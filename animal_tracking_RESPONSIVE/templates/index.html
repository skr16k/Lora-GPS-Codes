<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Animal Tracking Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-brand">
            <i class="fas fa-paw"></i>
            <h1>Animal Tracking</h1>
        </div>
        <div class="nav-status">
            <div class="status-item">
                <i class="fas fa-satellite-dish"></i>
                <span id="deviceCount">0</span>
            </div>
            <div class="status-item">
                <i class="fas fa-draw-polygon"></i>
                <span id="fenceCount">0</span>
            </div>
            <div class="status-item">
                <i class="fas fa-bell"></i>
                <span id="alertCount">0</span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Sidebar with mobile overlay -->
        <aside class="sidebar" id="sidebar">
            <div class="stats-section">
                <h3><i class="fas fa-chart-line"></i> Statistics</h3>

                <div class="stat-card primary">
                    <div class="stat-icon"><i class="fas fa-map-marker-alt"></i></div>
                    <div class="stat-content">
                        <div class="stat-label">Points</div>
                        <div class="stat-value" id="totalPoints">0</div>
                    </div>
                </div>

                <div class="stat-card success">
                    <div class="stat-icon"><i class="fas fa-shield-alt"></i></div>
                    <div class="stat-content">
                        <div class="stat-label">Fences</div>
                        <div class="stat-value" id="activeFences">0</div>
                    </div>
                </div>

                <div class="stat-card warning">
                    <div class="stat-icon"><i class="fas fa-clock"></i></div>
                    <div class="stat-content">
                        <div class="stat-label">Updated</div>
                        <div class="stat-value small" id="lastUpdate">Never</div>
                    </div>
                </div>

                <div class="stat-card danger">
                    <div class="stat-icon"><i class="fas fa-bell"></i></div>
                    <div class="stat-content">
                        <div class="stat-label">Alerts</div>
                        <div class="stat-value" id="violations">0</div>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3><i class="fas fa-sliders-h"></i> Controls</h3>

                <button class="control-btn primary" onclick="startDrawing()">
                    <i class="fas fa-plus"></i> Add Geofence
                </button>

                <button class="control-btn info" onclick="viewGeofences()">
                    <i class="fas fa-list"></i> Manage Fences
                </button>

                <button class="control-btn success" onclick="centerOnAnimal()">
                    <i class="fas fa-crosshairs"></i> Center
                </button>

                <button class="control-btn secondary" onclick="toggleHeatmap()">
                    <i class="fas fa-fire"></i> Heatmap
                </button>

                <button class="control-btn warning" onclick="exportCSV()">
                    <i class="fas fa-download"></i> Export
                </button>

                <button class="control-btn danger" onclick="clearAllData()">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>

            <div class="device-section">
                <h3><i class="fas fa-broadcast-tower"></i> Devices</h3>
                <div id="deviceList"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <div class="map-wrapper">
                <div id="map"></div>
                <div class="map-overlay">
                    <div class="map-tools">
                        <button class="tool-btn" onclick="map.zoomIn()" title="Zoom In">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="tool-btn" onclick="map.zoomOut()" title="Zoom Out">
                            <i class="fas fa-minus"></i>
                        </button>
                        <button class="tool-btn" onclick="toggleFullscreen()" title="Fullscreen">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Alerts Section -->
            <div class="alerts-container">
                <div class="alerts-header">
                    <h3><i class="fas fa-bell"></i> Alerts</h3>
                    <button class="clear-alerts-btn" onclick="clearAlerts()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="alertsList" class="alerts-list"></div>
            </div>
        </main>
    </div>

    <!-- Geofence Modal -->
    <div id="geofenceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-draw-polygon"></i> Geofence</h3>
                <button class="modal-close" onclick="cancelGeofence()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Name</label>
                    <input type="text" id="fenceName" placeholder="e.g., Main Pasture" class="form-input">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-shield-alt"></i> Type</label>
                    <select id="fenceType" class="form-input">
                        <option value="safe_zone">🛡️ Safe Zone</option>
                        <option value="restricted_zone">⚠️ Restricted</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-palette"></i> Color</label>
                    <input type="color" id="fenceColor" value="#00ff88" class="form-input color-input">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-bell"></i> Priority</label>
                    <select id="fencePriority" class="form-input">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="saveGeofence()">
                    <i class="fas fa-save"></i> Save
                </button>
                <button class="btn-secondary" onclick="cancelGeofence()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Geofence Panel -->
    <div id="geofencePanel" class="side-panel">
        <div class="panel-header">
            <h3><i class="fas fa-layer-group"></i> Geofences</h3>
            <button class="panel-close" onclick="closeGeofencePanel()">×</button>
        </div>
        <div id="geofenceList" class="panel-content"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
